<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="E-commerce platform: client, Ocelot gateway, six .NET services, RabbitMQ broker, PostgreSQL, MongoDB and Redis">
  <defs>
    <style>
      .box { fill: none; stroke: #8b8b8b; stroke-opacity: .55; stroke-width: 1.2; }
      .box--svc { fill: #8b8b8b; fill-opacity: .06; }
      .t { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #9a9a9a; font-size: 12px; }
      .t--hd { fill: #b9b9b9; font-size: 10px; letter-spacing: .14em; }
      .ln { stroke: #8b8b8b; stroke-opacity: .45; stroke-width: 1; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8b8b8b" fill-opacity=".6" />
    </marker>
  </defs>

  <text class="t t--hd" x="40" y="28">CLIENT</text>
  <text class="t t--hd" x="220" y="28">EDGE</text>
  <text class="t t--hd" x="430" y="28">SERVICES · .NET</text>
  <text class="t t--hd" x="700" y="28">TRANSPORT</text>
  <text class="t t--hd" x="840" y="28">STORES</text>

  <rect class="box" x="40" y="196" width="130" height="66" rx="4" />
  <text class="t" x="60" y="224">web / mobile</text>
  <text class="t" x="60" y="244" opacity=".6">https</text>

  <rect class="box" x="220" y="196" width="140" height="66" rx="4" />
  <text class="t" x="238" y="224">Ocelot</text>
  <text class="t" x="238" y="244" opacity=".6">gateway</text>

  <line class="ln" x1="170" y1="229" x2="212" y2="229" marker-end="url(#ar)" />
  <line class="ln" x1="360" y1="229" x2="418" y2="229" marker-end="url(#ar)" />

  <g>
    <rect class="box box--svc" x="430" y="44" width="210" height="46" rx="4" /><text class="t" x="446" y="72">identity</text>
    <rect class="box box--svc" x="430" y="106" width="210" height="46" rx="4" /><text class="t" x="446" y="134">product</text>
    <rect class="box box--svc" x="430" y="168" width="210" height="46" rx="4" /><text class="t" x="446" y="196">cart</text>
    <rect class="box box--svc" x="430" y="230" width="210" height="46" rx="4" /><text class="t" x="446" y="258">order</text>
    <rect class="box box--svc" x="430" y="292" width="210" height="46" rx="4" /><text class="t" x="446" y="320">payment</text>
    <rect class="box box--svc" x="430" y="354" width="210" height="46" rx="4" /><text class="t" x="446" y="382">notification</text>
  </g>

  <g class="ln">
    <line x1="640" y1="67" x2="692" y2="67" />
    <line x1="640" y1="129" x2="692" y2="129" />
    <line x1="640" y1="191" x2="692" y2="191" />
    <line x1="640" y1="253" x2="692" y2="253" />
    <line x1="640" y1="315" x2="692" y2="315" />
    <line x1="640" y1="377" x2="692" y2="377" />
    <line x1="700" y1="67" x2="700" y2="377" stroke-opacity=".7" />
  </g>

  <rect class="box" x="700" y="168" width="70" height="118" rx="4" />
  <text class="t" x="712" y="216">Rabbit</text>
  <text class="t" x="712" y="234">MQ</text>

  <g class="ln">
    <line x1="770" y1="200" x2="832" y2="96" marker-end="url(#ar)" />
    <line x1="770" y1="227" x2="832" y2="227" marker-end="url(#ar)" />
    <line x1="770" y1="254" x2="832" y2="358" marker-end="url(#ar)" />
  </g>

  <rect class="box" x="840" y="72" width="120" height="46" rx="4" /><text class="t" x="856" y="100">PostgreSQL</text>
  <rect class="box" x="840" y="204" width="120" height="46" rx="4" /><text class="t" x="856" y="232">MongoDB</text>
  <rect class="box" x="840" y="336" width="120" height="46" rx="4" /><text class="t" x="856" y="364">Redis</text>

  <text class="t" x="40" y="440" opacity=".5">.NET Aspire · Docker — one command brings the topology up</text>
</svg>
